<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto São Francisco - Adoção</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f9f9f9;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
    }
    main {
      padding: 1rem;
    }
    .card {
      background: white;
      margin: 1rem auto;
      padding: 1rem;
      border-radius: 8px;
      max-width: 400px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    img {
      max-width: 100%;
      border-radius: 8px;
    }
    footer {
      background-color: #333;
      color: white;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Projeto São Francisco</h1>
    <p>Adoção responsável</p>
  </header>
  <main>
    <div class="card">
      <h2>Bem-vindo!</h2>
      <p>Conheça nossos animais disponíveis para adoção.</p>
      <img src="cachorro.jpg" alt="Cachorro para adoção">
    </div>
  </main>
  <footer>
    <p>Entre em contato: projeto@adocao.com</p>
  </footer>
</body>
</html>
